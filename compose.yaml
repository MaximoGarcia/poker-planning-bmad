services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
